# Met l'application en ligne (GitHub Pages, en https) et rafraîchit les alertes trafic toutes les 15 minutes.
name: Publier

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Mettre à jour les alertes
        run: node tools/build_data.js
      - name: Écrire la configuration (clés Google Maps et TomTom)
        env:
          GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
          TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}
        run: |
          printf "window.CAP_CONFIG = { googleKey: '%s', tomtomKey: '%s' };\n" "$GOOGLE_MAPS_KEY" "$TOMTOM_KEY" > config.js
      - name: Reprendre la base des parkings (fabriquée chaque semaine par parkings.yml)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download donnees -p parkings.zip 2>/dev/null; then
            unzip -q parkings.zip -d data && rm parkings.zip && ls data/parking | wc -l
          else
            echo "Pas encore de base des parkings."
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploiement
        uses: actions/deploy-pages@v4
